[project]
name = "satnogs-dashboard"
version = "0.1.0"
description = "Observation Review Workbench composing satnogs-signal, satnogs-id, satnogs-decoder"
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "uvicorn",
    "jinja2",
    "httpx",
    "python-multipart",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: live engine-container smoke tests (deselected by default)"]
addopts = "-m 'not slow'"
